# Compatibility configuration for the installed Alt-Ergo 2.4.3-free executable.
# Run with the opam switch on PATH; the numeric version pins the legacy driver.
# Load with -wp-why3-extra-config and select -wp-prover Alt-Ergo:2.4.3 explicitly.
[prover]
name = "Alt-Ergo"
version = "2.4.3"
command = "alt-ergo --timelimit %t %f"
driver = "alt_ergo"
